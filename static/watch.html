<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drop WATCH — Live Status</title>
<link rel="icon" href="/static/logo-mark.jpg">
<link rel="stylesheet" href="/static/styles.css">
<style>
.watch-hero{text-align:center;padding:32px 16px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:16px;margin:16px}
.status-dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px}
.status-good{background:#2ecc71;box-shadow:0 0 12px #2ecc71}
.status-warn{background:#f39c12;box-shadow:0 0 12px #f39c12}
.status-bad{background:#e74c3c;box-shadow:0 0 12px #e74c3c}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.metric{background:#1c1c23;border-radius:12px;padding:16px;text-align:center}
.metric .num{font-size:1.6rem;font-weight:800;color:var(--acc)}
.upgrade{border-left:4px solid #3498db;padding:10px;margin:8px 0;background:#1c1c23;border-radius:0 12px 12px 0}
</style>
</head><body>
<header class="topbar"><a class="brand" href="/"><img class="brandmark" src="/static/logo-mark.jpg" alt="Drop"><b>Drop</b><span class="tag">watch</span></a></header>

<div id="login" class="card" style="max-width:400px;margin:40px auto;text-align:center">
  <h2>👁️ Drop WATCH</h2>
  <p class="small">Enter the watch code to see live status.</p>
  <input id="code" type="password" placeholder="Code" style="text-align:center;font-size:1.2rem;letter-spacing:4px">
  <button class="btn" id="gobtn" style="margin-top:12px">Enter</button>
  <p class="small" id="err" style="color:#ff6b6b"></p>
</div>

<div id="watchapp" style="display:none">
  <div class="watch-hero">
    <h1 style="margin:0">👁️ Drop is <span id="health">…</span></h1>
    <p class="small" id="updated"></p>
  </div>
  <div class="metric-grid" id="metrics"></div>
  <div class="card">
    <h3>🤖 AI Upgrades in Progress</h3>
    <p class="small">What the AI is building for Drop right now.</p>
    <div id="upgrades"></div>
  </div>
  <div class="card">
    <h3>🔧 Self-Maintenance</h3>
    <p class="small">What the AI checked and fixed recently.</p>
    <div id="maintenance"></div>
  </div>
  <div class="card">
    <h3>📊 Platform Health</h3>
    <div id="healthdetail"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
$('gobtn').onclick=()=>{
  if($('code').value.trim()==='LOVE'){
    $('login').style.display='none';$('watchapp').style.display='block';
    load();
    setInterval(load, 60000);
  } else { $('err').textContent='Wrong code.'; }
};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('gobtn').click();});

async function load(){
  try{
    const d=await(await fetch('/api/watch/status')).json();
    $('health').innerHTML=`<span class="status-dot ${d.health==='good'?'status-good':d.health==='warn'?'status-warn':'status-bad'}"></span>${d.health_label}`;
    $('updated').textContent='Updated '+new Date().toLocaleString();
    $('metrics').innerHTML=[
      ['🏪','Restaurants',d.restaurants],['🌍','Cities',d.cities],
      ['📦','Orders today',d.orders_today],['🛵','Active deliveries',d.active],
    ].map(([e,l,v])=>`<div class="metric"><div style="font-size:1.5rem">${e}</div><div class="num">${v}</div><div class="small">${l}</div></div>`).join('');
    $('upgrades').innerHTML=d.upgrades.map(u=>`
      <div class="upgrade"><b>${u.title.replace(/</g,'&lt;')}</b>
      <span class="small" style="margin-left:8px">${u.status}</span></div>`).join('')
      ||'<p class="small">No upgrades in progress right now.</p>';
    $('maintenance').innerHTML=d.maintenance.map(m=>`
      <div style="padding:6px 0;border-bottom:1px solid #222">
      <span class="small">${m.title.replace(/</g,'&lt;')}</span><br>
      <span class="small" style="opacity:.6">${m.when}</span></div>`).join('')
      ||'<p class="small">All systems nominal.</p>';
    $('healthdetail').innerHTML=`
      <p class="small">🟢 Website: <b>${d.site_up?'Online':'Offline'}</b><br>
      🟢 Orders flowing: <b>${d.orders_flowing?'Yes':'No'}</b><br>
      🟢 AI monitoring: <b>Active</b> — checks every Sunday<br>
      📈 Trend: <b>${d.trend}</b></p>`;
  }catch(e){
    $('health').textContent='unreachable';
  }
}
</script></body></html>
