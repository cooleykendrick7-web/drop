<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drop — Live Status</title>
<link rel="icon" href="/static/logo-mark.jpg">
<link rel="stylesheet" href="/static/styles.css">
<style>
.health{font-size:3rem;text-align:center;margin:20px 0 6px}
.health-lbl{text-align:center;font-size:1.2rem;font-weight:800;margin-bottom:20px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:#1c1c22;border-radius:12px;padding:16px;text-align:center}
.stat b{font-size:1.6rem;display:block}
.chatbox{max-height:250px;overflow-y:auto;margin:10px 0}
.chatmsg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:85%}
.chatmsg.watcher{background:#1c1c22}
.chatmsg.owner{background:var(--acc);color:#fff;margin-left:auto}
</style>
</head><body>
<header class="topbar"><a class="brand" href="/"><img class="brandmark" src="/static/logo-mark.jpg" alt="Drop"><b>Drop</b></a>
<button class="btn small ghost" id="logoutbtn" style="width:auto;margin-left:auto;display:none">🚪 Log out</button></header>

<div id="login" class="card" style="max-width:400px;margin:40px auto">
  <h2>👀 Live Status</h2>
  <p class="small">Enter the watch code.</p>
  <input id="pin" inputmode="numeric" placeholder="••••" maxlength="8">
  <button class="btn" id="gobtn">View status</button>
  <p class="small" id="loginmsg"></p>
</div>

<div id="app" style="display:none;max-width:520px;margin:0 auto;padding:0 16px">
  <div class="health" id="health-emoji">⏳</div>
  <div class="health-lbl" id="health-lbl">Checking…</div>

  <div class="statgrid" id="stats"></div>

  <div class="card">
    <b>💼 Investment opportunities</b>
    <p class="small">Drop is growing. Want to be part of it?</p>
    <a class="btn" href="/investors.html" style="text-decoration:none;text-align:center;display:block">Learn about investing →</a>
  </div>

  <div class="card">
    <b>💬 Message the owner</b>
    <div class="chatbox" id="chatbox"></div>
    <div class="row" style="margin-top:8px">
      <input id="chatmsg" placeholder="Type a message…" style="flex:1;margin-right:8px">
      <button class="btn small" id="chatsend" style="width:auto">Send</button>
    </div>
  </div>
  <p class="small" style="text-align:center;opacity:.5;margin:16px 0">Auto-refreshes every 15 seconds</p>
</div>

<script>
const $=id=>document.getElementById(id);
let PIN=sessionStorage.getItem('watchpin')||'';
const H=()=>({'x-pin':PIN});

$('gobtn').onclick=async()=>{
  PIN=$('pin').value.trim();
  const r=await fetch('/api/watcher/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:PIN})});
  if(r.ok){sessionStorage.setItem('watchpin',PIN);showApp();}
  else $('loginmsg').textContent='Invalid code.';
};
if(PIN)showApp();

function showApp(){
  $('login').style.display='none';$('app').style.display='block';
  $('logoutbtn').style.display='block';
  load(); setInterval(load,15000);
  loadChat(); setInterval(loadChat,10000);
}
$('logoutbtn').onclick=()=>{
  sessionStorage.removeItem('watchpin');
  location.reload();
};
async function load(){
  const r=await fetch('/api/watcher/live',{headers:H()});
  if(r.status===401){sessionStorage.removeItem('watchpin');location.reload();return;}
  if(!r.ok)return;
  const j=await r.json();
  const s=j.orders_by_status||{};
  const active=Object.entries(s).filter(([k])=>!['delivered','cancelled'].includes(k))
    .reduce((a,[,v])=>a+v,0);
  const delivered=s.delivered||0;
  const online=j.drivers.filter(d=>d.online).length;

  // health: doing good or needs attention?
  let emoji='✅', lbl='Doing good', color='#4ade80';
  if(!j.open){emoji='🔴';lbl='Currently closed';color='#f66';}
  else if(active>5){emoji='🔥';lbl='Busy — lots of orders!';color='#fbbf24';}
  else if(active===0&&delivered===0){emoji='😴';lbl='Quiet right now';color='#888';}
  $('health-emoji').textContent=emoji;
  $('health-lbl').textContent=lbl;
  $('health-lbl').style.color=color;

  $('stats').innerHTML=`
    <div class="stat"><b>${j.open?'🟢 Open':'🔴 Closed'}</b><span class="small">Site status</span></div>
    <div class="stat"><b>${active}</b><span class="small">Active orders</span></div>
    <div class="stat"><b>${delivered}</b><span class="small">Delivered today</span></div>
    <div class="stat"><b>${online}</b><span class="small">Drivers online</span></div>`;
}
async function loadChat(){
  const r=await fetch('/api/watcher/messages',{headers:H()});
  if(!r.ok)return;
  const j=await r.json();
  const box=$('chatbox');
  box.innerHTML=j.map(m=>`
    <div class="chatmsg ${m.sender}"><b class="small">${m.sender==='owner'?'👑 Owner':'👀 You'}</b><br>${m.message.replace(/</g,'&lt;')}</div>`
    ).join('');
  box.scrollTop=box.scrollHeight;
}
$('chatsend').onclick=async()=>{
  const msg=$('chatmsg').value.trim();
  if(!msg)return;
  await fetch('/api/watcher/messages',{method:'POST',headers:{...H(),'Content-Type':'application/json'},
    body:JSON.stringify({message:msg})});
  $('chatmsg').value=''; loadChat();
};
$('chatmsg').addEventListener('keydown',e=>{if(e.key==='Enter')$('chatsend').click();});
</script>
<script src="/static/chat.js"></script></body></html>
