<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drop — My Account</title>
<link rel="icon" href="/static/logo-mark.jpg">
<link rel="stylesheet" href="/static/styles.css">
<style>
.rwcard{background:linear-gradient(135deg,#ff6a00,#e63900 60%,#7a1e00);border-radius:20px;padding:22px;color:#fff;
  box-shadow:0 12px 32px rgba(255,106,0,.35);margin-bottom:18px;position:relative;overflow:hidden}
.rwcard::after{content:'D';position:absolute;right:8px;top:-24px;font-size:9rem;font-weight:900;opacity:.14}
.rwcard .brand{font-weight:900;letter-spacing:2px;font-size:.8rem;opacity:.9}
.rwcard h2{margin:6px 0 2px;font-size:1.4rem}
.rwcard .dots{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.rwcard .dot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800}
.rwcard .dot.on{background:#fff;color:#e63900;border-color:#fff}
.rwcard .sub{font-size:.85rem;opacity:.92}
</style>
</head><body>
<header class="topbar"><a class="brand" href="/"><img class="brandmark" src="/static/logo-mark.jpg" alt="Drop"><b>Drop</b></a>
<a href="/" style="font-size:.85rem">← Order food</a></header>
<div style="max-width:560px;margin:20px auto;padding:0 16px" id="wrap"><p>Loading…</p></div>
<script>
const $=id=>document.getElementById(id);
function driverCardHTML(){
  return `<div class="card" style="border-left:4px solid #ff6a00">
    <b>🚗 Drive for Drop?</b>
    <p class="small">Approved drivers sign in to the <b>Driver Hub</b> with the 6-digit PIN emailed to you after approval.</p>
    <div class="row"><input id="dpin" inputmode="numeric" maxlength="6" placeholder="••••••" style="flex:1;margin-right:6px;text-align:center;letter-spacing:6px">
    <button class="btn small" id="dgo" style="width:auto">Driver sign-in →</button></div>
    <p class="small" id="dmsg"></p>
    <p class="small">🪪 To get approved you <b>must</b> submit a <b>valid driver's license</b> and <b>valid vehicle insurance</b>. <a href="/drive.html">Apply here →</a></p>
  </div>`;
}
function wireDriverCard(){
  const go=$('dgo'); if(!go) return;
  go.onclick=async()=>{
    const pin=$('dpin').value.trim();
    if(pin.length!==6){$('dmsg').textContent='Enter your 6-digit driver PIN.';return;}
    const r=await fetch('/api/drivers/pin-login',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
    const j=await r.json();
    if(!r.ok){$('dmsg').textContent=j.detail||'Invalid PIN — check the email we sent you.';return;}
    try{localStorage.setItem('driver_pin',pin);}catch(e){}
    location.href='/hub.html';
  };
}
async function load(){
  const r=await fetch('/api/auth/me');
  if(!r.ok){
    // not a customer — still offer driver sign-in
    $('wrap').innerHTML=`<h1>Drop Account</h1>
      <p class="small"><a href="/login.html">Customer sign-in →</a></p>
      <div style="margin-top:16px">${driverCardHTML()}</div>`;
    wireDriverCard();
    return;
  }
  const {user,rewards,orders}=await r.json();
  const dots=Array.from({length:10},(_,i)=>
    `<div class="dot ${i<rewards.punches?'on':''}">${i<rewards.punches?'✓':i+1}</div>`).join('');
  const rwmsg=rewards.free_fee
    ? '🎉 <b>FREE delivery</b> waiting for you — it applies automatically at checkout!'
    : rewards.punches===0
      ? 'Order 10 times, get your 11th delivery fee <b>free</b>.'
      : `${10-rewards.punches} more ${10-rewards.punches===1?'delivery':'deliveries'} for a <b>FREE</b> delivery fee!`;
  $('wrap').innerHTML=`
    <h1>Hey, ${user.name.split(' ')[0]} 👋</h1>
    ${driverCardHTML()}
    <div class="rwcard">
      <div class="brand">DROP REWARDS</div>
      <h2>${user.name}</h2>
      <div class="sub">${user.phone.replace(/(\d{3})(\d{3})(\d{4})/,'($1) $2-$3')}</div>
      <div class="dots">${dots}</div>
      <div class="sub">${rwmsg}</div>
    </div>
    <h2>Order history</h2>
    <div id="hist">${orders.map(o=>`
      <a class="card" href="/track.html?id=${o.id}" style="display:block;text-decoration:none;color:inherit">
        <div class="row"><b>#${o.id} · ${o.restaurant_name||'Drop'}</b><b>$${o.total.toFixed(2)}</b></div>
        <span class="small">${new Date(o.created_at).toLocaleDateString()} · ${o.status.replace(/_/g,' ')}</span>
      </a>`).join('')||'<p class="small">No orders yet — <a href="/">fix that 🧡</a></p>'}</div>
    <button class="btn ghost" id="logout" style="margin-top:14px">Log out</button>
    <button class="btn small" id="delacct" style="background:#e74c3c;margin-top:8px">🗑️ Delete my account</button>
    <h2 style="margin-top:20px">💳 Saved cards</h2>
    <div id="cards"></div>`;
  loadCards();
  wireDriverCard();
  $('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/';};
  $('delacct').onclick=async()=>{
    if(!confirm('⚠️ Delete your account? This removes your profile, login, rewards, and saved cards.')) return;
    if(!confirm('Really delete? This cannot be undone.')) return;
    const pw = prompt('Enter your password to confirm deletion:');
    if(!pw) return;
    const v=await fetch('/api/auth/verify',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if(!v.ok){ alert('Wrong password — account NOT deleted.'); return; }
    const r=await fetch('/api/user/account',{method:'DELETE'});
    const j=await r.json().catch(()=>({}));
    if(r.ok && j.ok){
      alert('Account deleted.');
      try{localStorage.removeItem('drop_phone');}catch(e){}
      location.href='/';
    }
    else alert('Delete failed: '+(j.detail||'please try again'));
  };
}
async function loadCards(){
  const phone = localStorage.getItem('drop_phone')||'';
  if(!phone) return;
  const cards = await(await fetch(`/api/user/cards?phone=${encodeURIComponent(phone)}`)).json();
  document.getElementById('cards').innerHTML = cards.map(c=>`
    <div class="card" style="margin:8px 0">
      <div class="row"><b>💳 •••• ${c.last4}</b><span class="small">${c.brand} ${c.exp_month}/${c.exp_year}</span></div>
      <button class="btn small ghost" onclick="removeCard(${c.id})">Remove</button>
    </div>`).join('')||'<p class="small">No saved cards. Cards you use at checkout will appear here.</p>';
}
async function removeCard(id){
  const phone = localStorage.getItem('drop_phone')||'';
  await fetch(`/api/user/cards/${id}?phone=${encodeURIComponent(phone)}`,{method:'DELETE'});
  loadCards();
}
load();
</script>
<script src="/static/chat.js"></script><script src="/static/drop-live.js"></script>
</body></html>
