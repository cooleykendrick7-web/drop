<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drop — Checkout</title>
<link rel="icon" href="/static/logo-mark.jpg">
<link rel="stylesheet" href="/static/styles.css">
</head><body>
<header class="topbar"><a class="brand" href="/"><img class="brandmark" src="/static/logo-mark.jpg" alt="Drop"><b>Drop</b></a><a class="acct" href="/account.html">👤 Account</a></header>
<a href="/" class="small">← Home</a>
<h1>Checkout</h1>
<div id="dev"></div>
<div id="summary" class="card"></div>
<div class="card">
  <label>Promo code</label>
  <div style="display:flex;gap:8px">
    <input id="promo" placeholder="Enter code" style="margin:0;text-transform:uppercase">
    <button class="btn small" id="applypromo" style="width:auto;padding:10px 18px">Apply</button>
  </div>
  <p class="small" id="promomsg" style="margin:6px 0 0"></p>
</div>
<div class="card">
  <label>Tip your driver <span class="small">(100% goes to your driver)</span></label>
  <div id="tips" style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0">
    <button class="btn small ghost tipbtn" data-t="0">$0</button>
    <button class="btn small ghost tipbtn" data-t="1">$1</button>
    <button class="btn small ghost tipbtn on" data-t="2">$2</button>
    <button class="btn small ghost tipbtn" data-t="5">$5</button>
    <input id="customtip" inputmode="decimal" placeholder="Custom $" style="width:110px;margin:4px 0">
  </div>
</div>
<div class="card">
  <label>🎁 Send as a gift?</label>
  <div class="chk"><input type="checkbox" id="isgift">
    <span class="small">This order is a gift for someone else</span></div>
  <div id="giftfields" style="display:none">
    <label>Recipient's name</label><input id="gname" placeholder="Who's the lucky one?">
    <label>Recipient's email or phone</label><input id="gcontact" placeholder="So we can send them a nice surprise message">
    <label>Gift message</label><textarea id="gmsg" rows="2" placeholder="Happy birthday! Dinner's on me 🧡"></textarea>
    <label>Deliver to (their address)</label><textarea id="gaddr" rows="2" placeholder="Their delivery address"></textarea>
  </div>
</div>
<div class="card">
  <label>📅 Schedule for later? (optional)</label>
  <input type="datetime-local" id="sched" style="width:100%">
  <p class="small">Leave blank for ASAP delivery. Pick a time and we'll fire it up then.</p>
</div>
<div class="card" id="creditcard" style="display:none">
  <div class="chk"><input type="checkbox" id="usecredit">
    <span class="small" id="creditlbl">Use my credit</span></div>
</div>
<div class="card">
  <label>Your name</label><input id="name" placeholder="Jane Doe" autocomplete="name">
  <label>Phone (so your driver can reach you)</label><input id="phone" placeholder="(555) 123-4567" inputmode="tel" autocomplete="tel">
  <label>Delivery address</label>
  <div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0">
    <div style="position:relative">
      <input id="address" placeholder="Street address *" autocomplete="street-address">
      <div id="addr-suggest" style="position:absolute;top:100%;left:0;right:0;background:#1c1c22;border:1px solid var(--line);border-radius:8px;z-index:10;display:none;max-height:180px;overflow:auto"></div>
    </div>
    <input id="addr-apt" placeholder="Apt / Suite / Unit (optional)">
    <div class="row" style="gap:8px">
      <input id="addr-city" placeholder="City *" style="flex:2" autocomplete="address-level2">
      <input id="addr-state" placeholder="State *" maxlength="2" style="flex:1;text-transform:uppercase" autocomplete="address-level1">
      <input id="addr-zip" placeholder="ZIP" inputmode="numeric" style="flex:1.2" autocomplete="postal-code">
    </div>
  </div>
  <label>Notes for your driver (optional)</label><textarea id="notes" rows="2" placeholder="Gate code, leave at door, etc."></textarea>
</div>
<button class="btn" id="pay">Place order</button>
<p class="small" id="msg"></p>
<script>
const rid = new URLSearchParams(location.search).get('rid');
let fee=3.99, minOrder=10, live=false, cart={}, menu=[], tip=2, promo={code:'',discount:0};
// gift toggle
document.getElementById('isgift').onchange=e=>{
  document.getElementById('giftfields').style.display=e.target.checked?'block':'none';
};
// address autocomplete (free Nominatim, as-you-type like DoorDash)
// Now fills the structured fields: street, city, state, zip
let addrTimer=null;
document.getElementById('address').addEventListener('input',e=>{
  clearTimeout(addrTimer);
  const q=e.target.value.trim();
  const box=document.getElementById('addr-suggest');
  if(q.length<4){box.style.display='none';return;}
  addrTimer=setTimeout(async()=>{
    try{
      const r=await (await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&addressdetails=1&limit=5`,{headers:{'Accept':'application/json'}})).json();
      if(!r.length){box.style.display='none';return;}
      box.innerHTML=r.map((x,i)=>`<div style="padding:10px;border-bottom:1px solid #333;cursor:pointer" data-i="${i}">📍 ${x.display_name.slice(0,80)}</div>`).join('');
      box.style.display='block';
      box.querySelectorAll('div').forEach(d=>d.onclick=()=>{
        const pick=r[+d.dataset.i];
        const a=pick.address||{};
        // street: house number + road
        const street=[a.house_number,a.road].filter(Boolean).join(' ')||pick.display_name.split(',')[0];
        document.getElementById('address').value=street;
        document.getElementById('addr-city').value=a.city||a.town||a.village||a.county||'';
        document.getElementById('addr-state').value=(a.state_code||a.state||'').slice(0,2).toUpperCase();
        document.getElementById('addr-zip').value=a.postcode||'';
        box.style.display='none';
      });
    }catch(err){box.style.display='none';}
  },400);
});
function buildCheckoutAddr(){
  const street=document.getElementById('address').value.trim();
  const apt=document.getElementById('addr-apt').value.trim();
  const city=document.getElementById('addr-city').value.trim();
  const state=document.getElementById('addr-state').value.trim().toUpperCase();
  const zip=document.getElementById('addr-zip').value.trim();
  const ok=!!(street&&city&&state);
  let full=street;
  if(apt)full+=', '+apt;
  full+=', '+city+', '+state;
  if(zip)full+=' '+zip;
  return {full, ok, parts:{street,apt,city,state,zip}};
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#addr-suggest')&&e.target.id!=='address')
    document.getElementById('addr-suggest').style.display='none';
});
function getTip(){
  const c=parseFloat(document.getElementById('customtip').value);
  if(c>0) return Math.min(100,Math.round(c*100)/100);
  return tip;
}
function foodTotal(){
  let food=0;
  for(const [id,q] of Object.entries(cart)){
    const m=menu.find(x=>x.id==id); if(m) food+=m.price*q;
  }
  return Math.round(food*100)/100;
}
document.getElementById('applypromo').onclick=async()=>{
  const code=document.getElementById('promo').value.trim();
  const msg=document.getElementById('promomsg');
  if(!code){msg.textContent='';return;}
  const r=await (await fetch('/api/promo/validate',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code,subtotal:foodTotal()})})).json();
  if(r.valid){
    promo={code:r.code,discount:r.discount};
    msg.innerHTML=`<span style="color:var(--ok)">✓ ${r.code} applied: -$${r.discount.toFixed(2)}</span>`;
  }else{
    promo={code:'',discount:0};
    msg.innerHTML=`<span style="color:#ff6b6b">${r.message}</span>`;
  }
  drawSummary();
};
document.querySelectorAll('.tipbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tipbtn').forEach(x=>{x.classList.remove('on');x.classList.add('ghost');});
  b.classList.add('on');b.classList.remove('ghost');
  document.getElementById('customtip').value='';
  tip=parseFloat(b.dataset.t); drawSummary();
});
document.getElementById('customtip').addEventListener('input',()=>{
  if(document.getElementById('customtip').value.trim()!==''){
    document.querySelectorAll('.tipbtn').forEach(x=>{x.classList.remove('on');x.classList.add('ghost');});
  }
  drawSummary();
});
function drawSummary(){
  const t=getTip();
  let food=0, rows='';
  for(const [id,q] of Object.entries(cart)){
    const m=menu.find(x=>x.id==id); if(!m) continue;
    food+=m.price*q; rows+=`<div class="row"><span>${q}× ${m.name}</span><span>$${(m.price*q).toFixed(2)}</span></div>`;
  }
  // re-check promo against current cart (items may have changed)
  document.getElementById('summary').innerHTML = rows +
    `<div class="row"><span>Delivery fee</span><span>$${fee.toFixed(2)}</span></div>
     <div class="row"><span>Driver tip</span><span>$${t.toFixed(2)}</span></div>
     ${promo.discount>0?`<div class="row" style="color:var(--ok)"><span>Discount (${promo.code})</span><span>-$${promo.discount.toFixed(2)}</span></div>`:''}
     <div class="row total"><span>Total</span><span>$${(food+fee+t-promo.discount).toFixed(2)}</span></div>
     <div class="row"><button class="btn ghost small" id="clr" style="width:auto">🗑️ Clear cart</button></div>
     ${food<minOrder?`<p class="small" style="color:#ff6b6b">Minimum order is $${minOrder.toFixed(2)} of food — add $${(minOrder-food).toFixed(2)} more.</p>`:''}`;
  document.getElementById('clr').onclick=()=>{
    if(!confirm('Remove everything from your cart?'))return;
    localStorage.removeItem('dropcart_'+rid);
    location.href='/restaurant.html?id='+rid;
  };
  window._food=food;
}
async function load(){
  if(new URLSearchParams(location.search).get('cancelled'))
    document.getElementById('msg').textContent='Payment was cancelled — your order is saved, you can try again.';
  const cfg = await (await fetch('/api/config')).json();
  fee=cfg.delivery_fee; minOrder=cfg.min_order||10; live=cfg.stripe_live;
  if(!cfg.open_now){
    document.getElementById('pay').disabled=true;
    document.getElementById('pay').style.opacity=.5;
    document.getElementById('msg').textContent=`We're closed right now — back at ${cfg.hours_label.split('–')[0]}. Your cart is saved.`;
  }
  if(!sessionStorage.getItem('dropv')){sessionStorage.setItem('dropv','1');
    fetch('/api/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'checkout'})});}
  // logged in? pre-fill + rewards
  try{
    const me = await (await fetch('/api/auth/me')).json();
    if(me.user){
      document.getElementById('name').value=me.user.name||'';
      document.getElementById('phone').value=me.user.phone.replace(/(\d{3})(\d{3})(\d{4})/,'($1) $2-$3')||'';
      // referral credit
      const credit=me.user.credit||0;
      if(credit>0){
        document.getElementById('creditcard').style.display='block';
        document.getElementById('creditlbl').textContent=`Use my $${credit.toFixed(2)} credit`;
      }
      const rw=me.rewards;
      const banner=document.createElement('div');
      banner.className='card';
      banner.innerHTML = rw.free_fee
        ? '🎉 <b>FREE delivery</b> applied from your Drop Rewards card!'
        : `🧡 Drop Rewards: <b>${rw.punches}/10</b> punches ${rw.punches>0?`(${10-rw.punches} to a free delivery)`:''}`;
      document.getElementById('summary').before(banner);
      if(rw.free_fee) fee=0;
    }
  }catch(e){}
  if(!live) document.getElementById('dev').innerHTML='<div class="devbanner">🚧 TEST MODE — no real card is charged. Hit "Place order" then the test-pay button.</div>';
  cart = JSON.parse(localStorage.getItem('dropcart_'+rid)||'{}');
  const r = await (await fetch('/api/restaurants')).json();
  const rest = r.find(x=>x.id==rid); menu = rest? rest.menu : [];
  let food=0;
  for(const [id,q] of Object.entries(cart)){
    const m=menu.find(x=>x.id==id); if(m) food+=m.price*q;
  }
  if(!food){ document.body.innerHTML='<p>Your cart is empty. <a href="/">Home</a></p>'; return; }
  drawSummary();
}
document.getElementById('pay').onclick = async ()=>{
  const name=document.getElementById('name').value.trim(),
        phone=document.getElementById('phone').value.trim(),
        notes=document.getElementById('notes').value.trim();
  const addr=buildCheckoutAddr();
  const address=addr.full;
  const msg=document.getElementById('msg');
  if(!name||!phone){ msg.textContent='Please fill in name and phone.'; return; }
  if(!addr.ok){ msg.textContent='Please fill in street address, city, and state.'; return; }
  if(window.DROP_QUEUE && !window.DROP_QUEUE.accepting){ msg.textContent="We're at capacity right now — please check back soon."; return; }
  if(foodTotal()<minOrder){ msg.textContent=`Minimum food order is $${minOrder.toFixed(2)} — add a little more!`; return; }
  const isGift=document.getElementById('isgift').checked;
  const gift=isGift?{
    recipient_name:document.getElementById('gname').value.trim(),
    recipient_contact:document.getElementById('gcontact').value.trim(),
    message:document.getElementById('gmsg').value.trim(),
    address:document.getElementById('gaddr').value.trim()||address,
  }:null;
  if(isGift&&(!gift.recipient_name||!gift.address)){msg.textContent='Please fill in the recipient\'s name and delivery address.';return;}
  // scheduled order?
  const schedEl=document.getElementById('sched');
  const scheduled_for=schedEl&&schedEl.value?schedEl.value:'';
  if(scheduled_for){
    const dt=new Date(scheduled_for);
    if(isNaN(dt)||dt<=new Date()){msg.textContent='Pick a future date and time.';return;}
  }
  // referral credit?
  const useCredit=document.getElementById('usecredit')&&document.getElementById('usecredit').checked;
  msg.textContent='Placing your order…';
  const items=Object.entries(cart).map(([id,q])=>({menu_item_id:+id,qty:q}));
  const o = await (await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({restaurant_id:+rid,items,tip:getTip(),promo_code:promo.code,
      customer:{name,phone,address:gift?gift.address:address,address_parts:addr.parts,notes},gift,use_credit:useCredit})})).json();
  if(o.order_id===undefined){ msg.textContent='Error: '+(o.detail||'could not place order'); return; }
  try{localStorage.setItem('droplast',JSON.stringify({rid:+rid,items:cart,at:Date.now()}));}catch(e){}
  localStorage.removeItem('dropcart_'+rid);
  if(scheduled_for){
    await fetch('/api/orders/'+o.order_id+'/schedule',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({scheduled_for})});
  }
  const c = await (await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({order_id:o.order_id})})).json();
  if(c.url){ location.href=c.url; }
  else if(c.dev){
    document.getElementById('pay').outerHTML =
      `<button class="btn" onclick="testpay(${o.order_id})">✅ TEST PAY $${o.total.toFixed(2)} (no real charge)</button>`;
    msg.textContent='Order placed! Tap to simulate payment.';
  } else if(c.track_url){ location.href=c.track_url; }
};
async function testpay(oid){
  const r = await (await fetch('/api/dev-pay/'+oid,{method:'POST'})).json();
  location.href = r.track_url;
}
load();
</script>
<script src="/static/chat.js"></script><script src="/static/seasonal.js"></script>
</body></html>
