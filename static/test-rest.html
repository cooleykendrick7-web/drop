<!DOCTYPE html><html><head><title>Test</title></head><body>
<h1>Restaurant Test</h1>
<div id="out">Loading…</div>
<script>
async function test(){
  const out = document.getElementById('out');
  try{
    out.innerHTML += '<p>Fetching…</p>';
    const resp = await fetch('/api/restaurants');
    out.innerHTML += '<p>Got response: ' + resp.status + '</p>';
    const data = await resp.json();
    out.innerHTML += '<p>Total: ' + data.length + '</p>';
    const nash = data.filter(x=>(x.city||'')==='Nashville' && (x.state||'')==='TN');
    out.innerHTML += '<p>Nashville: ' + nash.length + '</p>';
    out.innerHTML += '<ul>' + nash.map(x=>'<li>'+x.name+'</li>').join('') + '</ul>';
  }catch(e){
    out.innerHTML += '<p style="color:red">ERROR: ' + e.message + '</p>';
  }
}
test();
</script></body></html>
