<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drop — Request a Drop</title>
<link rel="icon" href="/static/logo-mark.jpg">
<link rel="stylesheet" href="/static/styles.css">
</head><body>
<header class="topbar">
  <a class="brand" href="/"><img class="brandmark" src="/static/logo-mark.jpg" alt="Drop"><b>Drop</b></a>
  <a class="acct" href="/account.html">👤 Account</a>
</header>

<div class="card" style="max-width:520px;margin:20px auto">
  <h2 style="margin-top:0">📦 Request a Drop</h2>
  <p class="small">Food, packages, anything. We pick it up and bring it to you. Works everywhere.</p>

  <label>What are we picking up?</label>
  <input id="what" placeholder="e.g. Pizza from Domino's, package, documents">

  <label>Pickup address</label>
  <input id="from" placeholder="Where do we get it?">

  <label>Delivery address</label>
  <input id="to" placeholder="Where do we bring it?">

  <label>Details <span class="small">(order #, name on order, special instructions)</span></label>
  <input id="details" placeholder="e.g. Order #1234 under Mike, call when here">

  <label>Your name</label>
  <input id="name" placeholder="Your name">

  <label>Phone</label>
  <input id="phone" placeholder="For driver updates" inputmode="tel">

  <div class="card" style="margin:12px 0;background:#1a1a1a">
    <div class="row">
      <span><b>Estimated price</b><br><span class="small" id="price">Enter addresses for quote</span></span>
      <button class="btn small" id="quote" style="width:auto">Get quote</button>
    </div>
  </div>

  <button class="btn" id="go">Request Drop →</button>
  <p class="small" id="msg"></p>
</div>

<script>
const $=id=>document.getElementById(id);
let quoted=0;

async function geocode(addr){
  try{
    const r=await(await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(addr)}&format=json&limit=1`,{headers:{'User-Agent':'DropApp'}})).json();
    return r[0]?{lat:parseFloat(r[0].lat),lng:parseFloat(r[0].lon)}:null;
  }catch(e){return null;}
}

$('quote').onclick=async()=>{
  const from=$('from').value.trim(), to=$('to').value.trim();
  if(!from||!to){$('msg').textContent='Enter both addresses first.';return;}
  $('price').textContent='Calculating…';
  const f=await geocode(from), t=await geocode(to);
  if(!f||!t){$('price').textContent='Could not locate addresses.';return;}
  const miles=Math.hypot(t.lat-f.lat,t.lng-f.lng)*69;
  quoted=Math.max(3.99, Math.round(miles*1.50*100)/100);
  $('price').textContent=`$${quoted.toFixed(2)} (${miles.toFixed(1)} mi × $1.50)`;
};

$('go').onclick=async()=>{
  const body={
    what:$('what').value.trim(),
    pickup_address:$('from').value.trim(),
    delivery_address:$('to').value.trim(),
    details:$('details').value.trim(),
    customer_name:$('name').value.trim(),
    phone:$('phone').value.trim(),
    quoted_price:quoted,
  };
  if(!body.what||!body.pickup_address||!body.delivery_address||!body.customer_name){
    $('msg').textContent='Please fill in what, both addresses, and your name.';
    return;
  }
  $('go').disabled=true; $('go').textContent='Sending…';
  try{
    const r=await(await fetch('/api/drop/request',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    if(r.ok){
      location.href='/track.html?id='+r.order_id;
    } else {
      $('msg').textContent=r.detail||'Failed. Try again.';
      $('go').disabled=false; $('go').textContent='Request Drop →';
    }
  }catch(e){
    $('msg').textContent='Network error. Try again.';
    $('go').disabled=false; $('go').textContent='Request Drop →';
  }
};
</script></body></html>
