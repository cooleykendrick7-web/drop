<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Drop — Request Pickup</title>
<link rel="icon" href="/static/logo-mark.jpg">
<link rel="stylesheet" href="/static/styles.css">
</head><body>
<header class="topbar"><a class="brand" href="/"><img class="brandmark" src="/static/logo-mark.jpg" alt="Drop"><b>Drop</b></a><a class="acct" href="/account.html">👤 Account</a></header>
<a href="/" class="small">← All spots</a>
<div id="head"></div>

<div class="card" style="max-width:520px;margin:16px auto">
  <h2 style="margin-top:0">🛵 Get it picked up</h2>
  <p class="small">Order your food <b>directly from this spot</b> first — then tell us where to bring it. You only pay Drop for pickup + delivery, plus a small % for our gas fund. ⛽</p>

  <label>Your delivery address</label>
  <input id="daddr" placeholder="Where should we bring it?">

  <label>Order details <span class="small">(confirmation #, name on the order)</span></label>
  <input id="odetail" placeholder="e.g. Order #1234 under Mike">

  <label>Your name</label>
  <input id="cname" placeholder="Your name">

  <label>Your phone</label>
  <input id="cphone" placeholder="For driver updates" inputmode="tel">

  <label>Tip your driver <span class="small">(100% goes to them)</span></label>
  <div class="row" style="gap:8px;margin:6px 0" id="tips">
    <button class="btn small tipbtn" data-t="0">$0</button>
    <button class="btn small tipbtn" data-t="1">$1</button>
    <button class="btn small tipbtn" data-t="2">$2</button>
    <button class="btn small tipbtn" data-t="5">$5</button>
  </div>

  <div class="card" style="margin:12px 0;background:#1a1a1a">
    <div class="row"><span>Pickup + delivery</span><b id="qfee">$—</b></div>
    <div class="row"><span class="small">⛽ Gas fund (<span id="gaspct">10</span>%)</span><b id="qgas" class="small">$—</b></div>
    <div class="row"><span class="small">Driver tip</span><b id="qtip" class="small">$0.00</b></div>
    <div class="row" style="border-top:1px solid #333;padding-top:8px;margin-top:4px"><span><b>You'll pay</b></span><b id="qtotal">$—</b></div>
    <button class="btn small" id="quote" style="width:auto;margin-top:8px">Get exact quote</button>
    <p class="small" id="qnote" style="margin:6px 0 0"></p>
  </div>

  <button class="btn" id="go">Pay &amp; Request Pickup →</button>
  <p class="small" id="msg"></p>
</div>

<div id="reviews-sec"></div>
<script>
if(!sessionStorage.getItem('dropv')){sessionStorage.setItem('dropv','1');
fetch('/api/visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page:'restaurant'})});}
const rid = new URLSearchParams(location.search).get('id');
const $=id=>document.getElementById(id);
let rest=null, tip=0, gasPct=10, quotedFee=0, quotedGas=0;

document.querySelectorAll('.tipbtn').forEach(b=>{
  b.onclick=()=>{ tip=parseFloat(b.dataset.t);
    document.querySelectorAll('.tipbtn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); updateTotals(); };
});

async function geocode(addr){
  try{
    const r=await(await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(addr)}&format=json&limit=1`,{headers:{'User-Agent':'DropApp'}})).json();
    return r[0]?{lat:parseFloat(r[0].lat),lng:parseFloat(r[0].lon)}:null;
  }catch(e){return null;}
}

let acD=null;
attachAutocomplete($('daddr'), p=>{acD=p;});
function updateTotals(){
  $('qfee').textContent='$'+quotedFee.toFixed(2);
  $('qgas').textContent='$'+quotedGas.toFixed(2);
  $('qtip').textContent='$'+tip.toFixed(2);
  $('qtotal').textContent='$'+(quotedFee+quotedGas+tip).toFixed(2);
}

async function load(){
  const cfg = await (await fetch('/api/config')).json();
  gasPct=parseFloat(cfg.gas_pct||10); $('gaspct').textContent=gasPct;
  const r = await (await fetch('/api/restaurants')).json();
  rest = r.find(x=>x.id==rid);
  if(!rest){ document.body.innerHTML='<p>Spot not found. <a href="/">Home</a></p>'; return; }
  $('head').innerHTML =
    `${rest.photo?`<div class="hero-photo" style="background-image:url('${rest.photo}')"></div>`:''}
     <h1>${rest.logo?`<img class="rlogo-lg" src="${rest.logo}" alt="">`:rest.emoji} ${rest.name}</h1>
     <p class="sub">${rest.cuisine} · ${rest.address||rest.city} · ${rest.open?'Open now':'Closed'}</p>`;
  loadReviews();
}

$('quote').onclick=async()=>{
  const to=$('daddr').value.trim();
  if(!to){$('msg').textContent='Enter your delivery address first.';return;}
  if(!rest){return;}
  $('qnote').textContent='Calculating real road distance…';
  const from=`${rest.address||''} ${rest.city||''} ${rest.state||''}`.trim();
  try{
    let url=`/api/pickup/quote?pickup_address=${encodeURIComponent(from)}&delivery_address=${encodeURIComponent(to)}`;
    if(acD) url+=`&dlat=${acD.lat}&dlng=${acD.lng}`;
    const q=await(await fetch(url)).json();
    if(q.detail) throw new Error(q.detail);
    quotedFee=q.fee; quotedGas=q.gas_fee;
    $('qnote').textContent=`${q.miles} road miles from ${rest.name} to you.`;
    if(!q.geocoded) $('qnote').textContent+=' (estimate — we will honor a fair price)';
    updateTotals();
  }catch(e){
    $('qnote').textContent='Quote failed — try again.';
  }
};

$('go').onclick=async()=>{
  if(!rest){return;}
  const body={
    restaurant:rest.name,
    pickup_address:`${rest.address||''} ${rest.city||''} ${rest.state||''}`.trim(),
    delivery_address:$('daddr').value.trim(),
    order_details:$('odetail').value.trim(),
    customer_name:$('cname').value.trim(),
    phone:$('cphone').value.trim(),
    tip:tip,
  };
  if(!body.delivery_address||!body.customer_name){
    $('msg').textContent='Please fill in your delivery address and name.';return;
  }
  $('go').disabled=true; $('go').textContent='Sending…';
  try{
    const r=await(await fetch('/api/pickup/request',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    if(!r.ok&&r.order_id===undefined){throw new Error(r.detail||'Failed');}
    const c=await(await fetch('/api/checkout',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:r.order_id})})).json();
    if(c.url){ location.href=c.url; }
    else if(c.dev){ location.href=c.pay_url; }
    else if(c.track_url){ location.href=c.track_url; }
    else { location.href='/track.html?id='+r.order_id; }
  }catch(e){
    $('msg').textContent='Error: '+(e.message||'network error');
    $('go').disabled=false; $('go').textContent='Pay & Request Pickup →';
  }
};

// reviews
async function loadReviews(){
  const j=await (await fetch('/api/reviews/'+rid)).json();
  const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
  document.getElementById('reviews-sec').innerHTML=`
    <div class="card">
      <div class="row"><b>⭐ Reviews</b>
        <span class="small">${j.count?stars(j.avg)+' '+j.avg+' ('+j.count+')':'No reviews yet'}</span></div>
      <div id="revlist">${j.reviews.map(r=>`
        <div style="border-top:1px solid #222;padding:8px 0">
          <b class="small">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</b>
          <span class="small" style="opacity:.7"> · ${(r.name||'Drop customer').replace(/</g,'&lt;')}</span>
          ${r.text?`<p class="small" style="margin:4px 0">${r.text.replace(/</g,'&lt;')}</p>`:''}
        </div>`).join('')}</div>
      <div style="margin-top:10px">
        <label class="small">Leave a review</label>
        <div class="row" style="gap:4px;margin:6px 0" id="starpick">
          ${[1,2,3,4,5].map(n=>`<button class="btn small ghost" data-s="${n}" style="width:auto;font-size:1.3rem">☆</button>`).join('')}
        </div>
        <textarea id="revtext" rows="2" placeholder="How was it? (optional)" style="width:100%"></textarea>
        <button class="btn small" id="revgo" style="margin-top:8px">Post review</button>
        <p class="small" id="revmsg"></p>
      </div>
    </div>`;
  let picked=0;
  document.querySelectorAll('#starpick button').forEach(b=>b.onclick=()=>{
    picked=+b.dataset.s;
    document.querySelectorAll('#starpick button').forEach(x=>
      x.textContent=+x.dataset.s<=picked?'★':'☆');
  });
  document.getElementById('revgo').onclick=async()=>{
    if(!picked){document.getElementById('revmsg').textContent='Pick a star rating first.';return;}
    const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({restaurant_id:+rid,rating:picked,text:document.getElementById('revtext').value})});
    const j2=await r.json();
    document.getElementById('revmsg').textContent=r.ok?'✅ Thanks for the review!':'Error: '+(j2.detail||'log in first');
    if(r.ok)loadReviews();
  };
}
load();
</script>
<script src="/static/autocomplete.js"></script>
<script src="/static/chat.js"></script></body></html>
